<!DOCTYPE html>
<html>
<head>
<title>Image and Video</title>

<style>

img,video{
    width:250px;
    border:3px solid black;
    transition:0.5s;
}

/* Hover Effect */
img:hover,video:hover{
    transform:scale(1.1);
    border-color:red;
}

</style>
</head>

<body>

<h2>Image and Video Hover Effect</h2>

<!-- Image -->
<img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600"
alt="Nature Image">

<br><br>

<!-- Video -->
<video controls>
    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
</video>

</body>
</html>
