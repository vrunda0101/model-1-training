<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tailwind Flexbox Layout</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white p-4">
        <div class="flex justify-between items-center">

            <h1 class="text-2xl font-bold">
                FlexLayout
            </h1>

            <div class="flex gap-6 text-lg">
                <a href="#" class="hover:text-yellow-300">Home</a>
                <a href="#" class="hover:text-yellow-300">About</a>
                <a href="#" class="hover:text-yellow-300">Services</a>
                <a href="#" class="hover:text-yellow-300">Contact</a>
            </div>

        </div>
    </nav>

    <!-- Main Layout -->
    <div class="flex flex-col md:flex-row min-h-screen">


        <!-- Content Area -->
        <main class="flex-1 p-8">

            <h1 class="text-4xl font-bold text-gray-800 mb-8">
                Flexbox Layout using Tailwind CSS
            </h1>

            <!-- Cards -->
            <div class="flex flex-wrap gap-8 justify-center">

                <!-- Card 1 -->
                <div class="bg-white w-72 p-6 rounded-2xl shadow-lg hover:scale-105 transition duration-300">

                    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500"
                        class="rounded-xl mb-4 w-full h-40 object-cover" alt="">

                    <h2 class="text-2xl font-bold mb-2">
                        Card One
                    </h2>

                    <p class="text-gray-600">
                        Responsive flexbox card design using Tailwind CSS.
                    </p>

                    <button class="mt-4 bg-blue-500 text-white px-5 py-2 rounded-lg hover:bg-blue-700 transition">
                        Read More
                    </button>
                </div>

                <!-- Card 2 -->
                <div class="bg-white w-72 p-6 rounded-2xl shadow-lg hover:scale-105 transition duration-300">

                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500"
                        class="rounded-xl mb-4 w-full h-40 object-cover" alt="">

                    <h2 class="text-2xl font-bold mb-2">
                        Card Two
                    </h2>

                    <p class="text-gray-600">
                        Easily create layouts with flex utilities in Tailwind.
                    </p>

                    <button class="mt-4 bg-green-500 text-white px-5 py-2 rounded-lg hover:bg-green-700 transition">
                        Explore
                    </button>
                </div>

                <!-- Card 3 -->
                <div class="bg-white w-72 p-6 rounded-2xl shadow-lg hover:scale-105 transition duration-300">

                    <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=500"
                        class="rounded-xl mb-4 w-full h-40 object-cover" alt="">

                    <h2 class="text-2xl font-bold mb-2">
                        Card Three
                    </h2>

                    <p class="text-gray-600">
                        Modern responsive UI with hover effects and animations.
                    </p>

                    <button class="mt-4 bg-red-500 text-white px-5 py-2 rounded-lg hover:bg-red-700 transition">
                        View
                    </button>
                </div>

            </div>

        </main>

    </div>

</body>

</html>
