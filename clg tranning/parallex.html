<!DOCTYPE html>
<html>
<head>
    <title>Parallax and CSS Sprite Example</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            text-align:center;
        }

        /* ================= PARALLAX EFFECT ================= */

        .parallax{
            background-image:url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1200');

            height:500px;

            background-attachment:fixed;
            background-position:center;
            background-repeat:no-repeat;
            background-size:cover;
        }

        .parallax h1{
            color:white;
            font-size:50px;
            padding-top:220px;
        }

        /* ================= CONTENT SECTION ================= */

        .content{
            background-color:#f2f2f2;
            padding:50px;
        }

        .content p{
            font-size:20px;
        }

        /* ================= CSS IMAGE SPRITE ================= */

        .sprite{
            width:100px;
            height:100px;

            margin:auto;

            background-image:url('https://cdn-icons-png.flaticon.com/512/616/616408.png');

            background-size:200px 100px;

            background-position:0 0;

            transition:0.5s;
        }

        /* Hover Effect */

        .sprite:hover{
            background-position:-100px 0;
            transform:scale(1.1);
        }

    </style>
</head>

<body>

    <!-- ================= PARALLAX SECTION ================= -->

    <div class="parallax">

        <h1>Parallax Effect</h1>

    </div>

    <!-- ================= CONTENT SECTION ================= -->

    <div class="content">

        <h2>CSS Image Sprite Example</h2>

        <p>Move mouse over the image</p>

        <!-- Sprite Image -->

        <div class="sprite"></div>

    </div>

</body>
</html>
